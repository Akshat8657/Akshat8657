<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">AKSHAT TIWARI — SOFTWARE • SYSTEMS • AI</title>
<desc id="d">Hero banner: dark textured background, red accent marks, monospace type.</desc>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
.name{font-size:92px;font-weight:800;letter-spacing:3px;fill:#F4F4F4}
.ghost{font-size:92px;font-weight:800;letter-spacing:3px;fill:#E53935;opacity:.42}
.sub{font-size:24px;font-weight:700;letter-spacing:8px;fill:#E53935}
.meta{font-size:13px;font-weight:500;letter-spacing:2px;fill:#8B9097}
.tiny{font-size:11px;letter-spacing:2px;fill:#5C6168}
.cursor{animation:blink 1.1s steps(1) infinite}
.sweep{animation:sweep 7s linear infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{0%{transform:translateY(-10px)}100%{transform:translateY(330px)}}
@media (prefers-reduced-motion:reduce){.cursor,.sweep{animation:none}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#191919" stroke-width="1"/></pattern>
<pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" opacity=".22"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="8" fill="#E53935" opacity=".25"/></pattern>
<filter id="noise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer></filter>
<radialGradient id="glow" cx=".2" cy=".55" r=".55"><stop offset="0" stop-color="#E53935" stop-opacity=".16"/><stop offset="1" stop-color="#E53935" stop-opacity="0"/></radialGradient>
<linearGradient id="sweepg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E53935" stop-opacity="0"/><stop offset=".5" stop-color="#E53935" stop-opacity=".16"/><stop offset="1" stop-color="#E53935" stop-opacity="0"/></linearGradient>
</defs>
<!-- background texture -->
<rect width="1280" height="320" fill="#0D0D0D"/>
<rect width="1280" height="320" fill="url(#grid)"/>
<rect width="1280" height="320" fill="url(#glow)"/>
<rect width="1280" height="320" filter="url(#noise)"/>
<rect x="940" y="228" width="316" height="44" fill="url(#hatch)"/>
<rect width="1280" height="320" fill="url(#scan)"/>
<!-- frame + accent lines -->
<rect x=".5" y=".5" width="1279" height="319" fill="none" stroke="#222222"/>
<rect x="0" y="0" width="460" height="3" fill="#E53935"/>
<rect x="820" y="317" width="460" height="3" fill="#E53935"/>
<path d="M22 46V22h24M1234 22h24v24M22 274v24h24M1234 298h24v-24" fill="none" stroke="#E53935" stroke-width="2"/>
<path d="M640 34v12M634 40h12M640 274v12M634 280h12M900 154v12M894 160h12" stroke="#3A3A3A" stroke-width="1"/>
