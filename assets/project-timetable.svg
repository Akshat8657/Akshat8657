<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
<title id="t">Timetable Management System</title>
<desc id="d">Full college timetable software — automatic timetable generation with scheduling rules, clash detection, teacher substitution with notifications, reports, and an AI assistant. Built for Admin, HOD and Teacher roles. Tech: Python, FastAPI, React, Supabase, Gemini AI.</desc>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
.meta{font-size:12px;letter-spacing:2px;fill:#8B9097}
.title{font-size:28px;font-weight:800;letter-spacing:2px;fill:#F4F4F4}
.desc{font-size:15px;fill:#C5CAD1}
.tagt{font-size:12px;font-weight:700;letter-spacing:2px;fill:#E53935}
.tiny{font-size:11px;letter-spacing:2px;fill:#5C6168}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
<defs>
<pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" opacity=".2"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="8" fill="#E53935" opacity=".28"/></pattern>
</defs>
